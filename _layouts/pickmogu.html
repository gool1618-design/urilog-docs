<!DOCTYPE html>
{% comment %}
ピクモグ の公開文書だけに使う枠(2026-10-01)。
サイト共通の枠(jekyll-theme-minimal)は見出しに「バイヤーノート / 古着の相場検索…」を出すので、
ピクモグ の審査担当・利用者が別のアプリの文書だと取り違えないよう、アプリ名だけを出す。
{% endcomment %}
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="ピクモグ の{{ page.title | split: ' — ' | first }}">
  <style>
    body { margin: 0; background: #F3F4F7; color: #16202B; font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; line-height: 1.8; }
    header { background: #1F3A67; color: #fff; padding: 16px 20px; }
    header p { margin: 0; font-weight: 800; letter-spacing: .08em; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 1.6em; line-height: 1.4; }
    h2 { font-size: 1.2em; margin-top: 2em; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #CDD1D9; padding: 6px 10px; text-align: left; }
    a { color: #B0103A; }
    hr { border: none; border-top: 1px solid #CDD1D9; margin: 2em 0; }
  </style>
</head>
<body>
  <header><p>ピクモグ</p></header>
  <main>
{{ content }}
  </main>
</body>
</html>
