<title>今日はこれ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F3EE; --card:#FFFFFF; --ink:#1B2530; --muted:#66707A; --line:#D9DED8;
  --accent:#2F4F86; --accent-ink:#FFFFFF; --hi:#F2C14E; --hi-ink:#2A2000;
  --soft:#E6EBF3; --danger:#B4473F; --shadow:0 6px 24px rgba(27,37,48,.08);
  --tile1:#DCE6F5; --tile2:#F5E6D6; --tile3:#F7DCDC; --tile4:#DDEFE0;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171E; --card:#1B222B; --ink:#EEF2F6; --muted:#98A3AF; --line:#2B343F;
  --accent:#8AAEE6; --accent-ink:#0E1620; --hi:#F2C14E; --hi-ink:#2A2000;
  --soft:#232C37; --danger:#E07B73; --shadow:0 6px 24px rgba(0,0,0,.35);
  --tile1:#243248; --tile2:#3E3226; --tile3:#432A2C; --tile4:#233A2B;
}}
:root[data-theme="dark"]{
  --bg:#12171E; --card:#1B222B; --ink:#EEF2F6; --muted:#98A3AF; --line:#2B343F;
  --accent:#8AAEE6; --accent-ink:#0E1620; --hi:#F2C14E; --hi-ink:#2A2000;
  --soft:#232C37; --danger:#E07B73; --shadow:0 6px 24px rgba(0,0,0,.35);
  --tile1:#243248; --tile2:#3E3226; --tile3:#432A2C; --tile4:#233A2B;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",-apple-system,"Hiragino Sans",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
h1,h2,h3,.disp{font-family:"Zen Maru Gothic","Noto Sans JP","Hiragino Maru Gothic ProN",sans-serif;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;flex:1;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;color:var(--muted);font-size:13px}
.top button{color:var(--accent);font-weight:500;padding:8px 0}
.top .back::before{content:"‹ ";font-size:18px}
.grow{flex:1}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:26px;font-weight:700;line-height:1.3}
h2{font-size:20px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-weight:700;font-size:17px;padding:0 20px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:68px;font-size:19px}
.btn.secondary{background:var(--soft);color:var(--ink);min-height:48px;font-size:15px;font-weight:500}
.btn.ghost{color:var(--accent);min-height:44px;font-size:15px;font-weight:500}
.btn[disabled]{opacity:.45;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.static{border-style:dashed;color:var(--ink)}
.chip.ing{padding:8px 12px;display:inline-flex;gap:6px;align-items:center}
.chip.ing.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.card{background:var(--card);border-radius:20px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.tile{aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.tile small{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.tile.c-japanese{background:var(--tile1)} .tile.c-western{background:var(--tile2)} .tile.c-chinese{background:var(--tile3)} .tile.c-ethnic{background:var(--tile4)}
.cbody{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}
.cname{font-size:20px;font-weight:700}
.meta{display:flex;gap:12px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.duel{display:flex;flex-direction:column;gap:6px;flex:1}
.duel .card{flex:1;display:flex;flex-direction:column;text-align:left;width:100%;transition:transform .2s,box-shadow .2s}
.duel .card .tile{flex:1;aspect-ratio:auto;min-height:120px}
.duel .card.win{transform:scale(1.02);box-shadow:0 0 0 3px var(--hi),var(--shadow)}
.duel .card.lose{opacity:.45;transform:scale(.97)}
.vs{text-align:center;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.2em}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;min-height:0}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-height:0;transition:transform .15s,box-shadow .15s}
.gcard .gt{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.gcard .gb{padding:6px 10px 8px;display:flex;flex-direction:column;gap:1px}
.gcard .gn{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard .gm{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gcard.champ{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.gcard.champ .gt::before{content:"いまの候補";position:absolute;left:8px;top:6px;font-size:10px;font-weight:700;background:var(--hi);color:var(--hi-ink);padding:2px 7px;border-radius:999px}
.gcard.picked{transform:scale(1.04);box-shadow:0 0 0 3px var(--hi)}
.gcard.dim{opacity:.35}
.hint{font-size:13px;color:var(--muted);text-align:center}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink)}
.hero{position:relative}
.hero .tile{font-size:96px}
.decided-name{font-size:28px;font-weight:700}
.section{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item .n{flex:1}
.item .d{color:var(--muted);font-size:12px}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px}
.check.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.week{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.day .em{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.day .w{font-weight:700;width:2.2em;color:var(--muted);font-variant-numeric:tabular-nums}
.day .nm{flex:1;font-weight:500}
.day .nm small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.day button{color:var(--accent);font-size:13px;font-weight:500;padding:6px 8px;border-radius:8px;background:var(--soft)}
.home-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.home-card .em{font-size:36px;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.roulette{height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.roulette .em{font-size:72px}
.roulette .nm{font-size:22px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;background:var(--hi);color:var(--hi-ink);font-size:12px;font-weight:700;padding:0 6px}
.proto{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  return DISHES.filter(d => (d.form==='one_dish'||d.form==='main')
      && !d.tags.some(t=>S.exclude.includes(t)) && !S.hidden.includes(d.id) && !extraExclude.includes(d.id)
      && d.time<=cap && (!mood || d.moods.includes(mood)) && (mood!=='noodle_rice' || d.form==='one_dish'))
    .map(d=>{
      let s = 0;
      if (mood && d.moods.includes(mood)) s+=3;
      if (S.fav.includes(d.id)) s+=2;
      s += Math.min(2,(eatenCount[d.id]||0)*0.5);
      if (lastEaten[d.id]) { const a=daysAgo(lastEaten[d.id]); if(a<=7) s-=5; else if(a<=14) s-=2; }
      if (softToday.has(d.id)) s-=4;
      if (ctx.passed && ctx.passed.includes(d.id)) s-=2;
      if (ctx.champ && ctx.champ.id!==d.id && d.moods.some(m=>ctx.champ.moods.includes(m))) s+=2;
      s -= Math.min(1.5,(soft30[d.id]||0)*0.3);
      if (d.season.includes(sea)) s+=1;
      s += Math.random()*1.5;
      return {d,s};
    }).sort((a,b)=>b.s-a.s).map(x=>x.d);
}
const relaxTime = k => k==='quick'?'normal':'any';
function buildPool(sess, need=3){
  const ctx={passed:sess.passed, champ:sess.champ};
  const ex=sess.champ?[...sess.shown, sess.champ.id]:sess.shown;
  sess.relax=0; let p=pool(sess.mood,sess.time,ex,ctx);
  if(p.length<need){ sess.relax=1; sess.time=relaxTime(sess.time); p=pool(sess.mood,sess.time,ex,ctx); }
  if(p.length<need){ sess.relax=2; sess.mood=null; p=pool(null,sess.time,ex,ctx); }
  if(p.length<need){ p=pool(sess.mood,sess.time,sess.passed.length?[]:ex,ctx); } // 見せた料理も再利用
  return p;
}
function pickDiverse(p,n){
  const out=[]; const capC=Math.ceil(n/2), capF=Math.ceil(n*0.7);
  const cnt=(k,v)=>out.filter(o=>o[k]===v).length;
  for(const d of p){ if(out.length>=n) break; if(cnt('cuisine',d.cuisine)<capC && cnt('form',d.form)<capF) out.push(d); }
  for(const d of p){ if(out.length>=n) break; if(!out.includes(d)) out.push(d); }
  return out;
}
const mainProtein = d => ['pork','chicken','beef','fish','shrimp','egg','tofu'].find(t=>d.tags.includes(t))||'none';
function buildWeek(){
  const days=[]; const used=[];
  for(let i=0;i<7;i++){
    const dt=new Date(); dt.setDate(dt.getDate()+i); const date=dt.toISOString().slice(0,10);
    const wd=dt.getDay(); const timeKey=(wd===0||wd===6)?'any':S.stdTime;
    const prev=days[i-1]?byId(days[i-1].id):null;
    const oneDishCount=days.filter(x=>byId(x.id).form==='one_dish').length;
    let p=pool(null,timeKey,used).filter(d=>!prev || (d.cuisine!==prev.cuisine && mainProtein(d)!==mainProtein(prev)));
    if(oneDishCount>=3) p=p.filter(d=>d.form!=='one_dish');
    if(!p.length) p=pool(null,timeKey,used);
    const d=p[0]; days.push({date,id:d.id}); used.push(d.id);
  }
  return {start:days[0].date, days};
}

function render(){ app.innerHTML = VIEWS[view](); window.scrollTo(0,0); }
function go(v){ view=v; render(); }
function newSession(opts={}){
  sess={ mood:null, time:S.stdTime, relax:0, shown:[], passed:[], round:1, bothNo:0, redraws:2, champ:null, startedAt:Date.now(), taps:0, tired:!!opts.tired, entry:opts.tired?'tired':'decide' };
  S.stats.sessions++; save();
}
const GRID_N=10, MAX_ROUNDS=3;
function startDuel(){ sess.round=1; sess.champ=null; nextGrid(); }
function nextGrid(){
  const need=sess.champ?GRID_N-1:GRID_N;
  const p=buildPool(sess, 3);
  if(p.length<3 && !sess.champ){ return startOmakase('shortage'); }
  const fresh=pickDiverse(p, need);
  sess.shown.push(...fresh.map(d=>d.id));
  sess.grid=sess.champ?[sess.champ,...fresh]:fresh;
  go('duel');
}
function pick(id){
  sess.taps++;
  const d=byId(id);
  const cards=[...document.querySelectorAll('.gcard')];
  cards.forEach(c=>c.classList.add(c.dataset.id===id?'picked':'dim'));
  // 選ばれなかった料理は「見送り」(このセッション内でだけ −2)。嫌いではない
  sess.grid.forEach(g=>{ if(g.id!==id && !sess.passed.includes(g.id)) sess.passed.push(g.id); });
  const confirmChamp = sess.champ && sess.champ.id===id;
  setTimeout(()=>{
    if(confirmChamp || sess.round>=MAX_ROUNDS){ sess.decided=d; sess.method='grid'; go('decided'); return; }
    sess.champ=d; sess.round++; nextGrid();
  },220);
}
function bothNo(){
  sess.taps++; sess.bothNo++;
  sess.grid.forEach(g=>{ if(!sess.champ||g.id!==sess.champ.id) S.softNo.push({id:g.id,date:today()}); }); save();
  if(sess.bothNo>=3){ if(confirm('3回とも合いませんでした。おまかせで決めますか?')) return startOmakase('bothNo'); }
  nextGrid();
}
function redraw(){ sess.taps++; S.softNo.push({id:sess.decided.id,date:today()}); save(); sess.redraws--; sess.champ=null; sess.round=1; nextGrid(); }
function startOmakase(from){
  sess.taps++; sess.omakaseFrom=from;
  if(sess.tired){ sess.mood=null; sess.time='quick'; }
  let p=buildPool(sess).filter(d=>!S.softNo.some(x=>x.id===d.id&&x.date===today()));
  if(sess.tired) p=p.filter(d=>d.form==='one_dish'&&d.effort===1);
  if(p.length<1) p=pool(null,'any');
  sess.cands=p.slice(0,6); go('omakase');
  const el=()=>document.getElementById('roul'); let i=0, steps=14, delay=60;
  const tick=()=>{ const d=sess.cands[i%sess.cands.length]; if(el()) el().innerHTML=`<div class="em">${emoji(d)}</div><div class="nm">${esc(d.name)}</div>`; i++; if(i<steps){ delay*=1.18; setTimeout(tick,delay);} else { sess.decided=sess.cands[(i-1)%sess.cands.length]; sess.method='omakase'; sess.redraws=0; sess.omakaseAgain=1; setTimeout(()=>go('decided'),350);} };
  tick();
}
function confirmDecision(){
  sess.taps++;
  const d=sess.decided; S.last={id:d.id,date:today()};
  const secs=Math.round((Date.now()-sess.startedAt)/1000);
  S.stats.decided++; S.stats.secs.push(secs); S.stats.taps.push(sess.taps); save();
  sess.secs=secs; go('done');
}
function toggleShop(name,dish){
  const i=S.shopping.findIndex(x=>x.name===name&&x.dish===dish);
  if(i>=0) S.shopping.splice(i,1); else S.shopping.push({name,dish,checked:false});
  save(); render();
}
function eat(){ S.eaten.push({id:sess.decided.id,date:today()}); save(); toast('食べた、を記録しました'); go('home'); }
function fav(id){ const i=S.fav.indexOf(id); if(i>=0) S.fav.splice(i,1); else S.fav.push(id); save(); render(); }
function hide(id){ if(confirm('この料理を今後出さないようにしますか?')){ S.hidden.push(id); save(); toast('出さない料理に追加しました'); go('home'); } }
function recipe(d){ S.stats.recipe++; save(); window.open('https://www.google.com/search?q='+encodeURIComponent(d.name+' レシピ'),'_blank','noopener'); }
function satisfy(ok){ if(ok) S.stats.ok++; else S.stats.ng++; sess.rated=true; save(); render(); }

function reroll(i){ const w=sess.week; const used=w.days.map(x=>x.id); const dt=new Date(w.days[i].date); const wd=dt.getDay(); const timeKey=(wd===0||wd===6)?'any':S.stdTime;
  const prev=w.days[i-1]?byId(w.days[i-1].id):null, next=w.days[i+1]?byId(w.days[i+1].id):null;
  let p=pool(null,timeKey,used).filter(d=>(!prev||(d.cuisine!==prev.cuisine&&mainProtein(d)!==mainProtein(prev)))&&(!next||(d.cuisine!==next.cuisine&&mainProtein(d)!==mainProtein(next))));
  if(!p.length) p=pool(null,timeKey,used); if(!p.length) return toast('候補がありません');
  w.days[i].id=p[0].id; render(); }
function planGo(id){ newSession(); sess.decided=byId(id); sess.method='plan'; sess.redraws=0; sess.taps=1; go('decided'); }

Object.defineProperty(window,'sess',{get:()=>sess,set:v=>{sess=v}});
render();
